<div
  class="min-h-screen flex items-center justify-center bg-[url('/assets/images/pergamino-textura.png')] bg-cover bg-center px-4 font-medieval"
>
  <div
    class="bg-black/60 rounded-2xl shadow-xl p-8 w-full max-w-md text-center border border-yellow-700 text-white"
  >
    <h1 class="text-2xl font-bold text-yellow-100 mb-4">Enigma Microbiota</h1>
    <p class="text-white/90 mb-6">Ingresa el código que te dio el organizador</p>

    <form (ngSubmit)="joinEvent()" [formGroup]="form">
      <div class="mb-4">
        <input
          formControlName="eventCode"
          type="text"
          placeholder="Ej. 345679"
          class="w-full px-4 py-2 border-b-2 border-white bg-transparent text-white placeholder-white/70 focus:outline-none focus:border-yellow-400 text-center"
        />
        <div
          *ngIf="form.get('eventCode')?.touched && form.get('eventCode')?.errors"
          class="text-red-400 text-sm mt-1 text-left"
        >
          <span *ngIf="form.get('eventCode')?.errors?.['required']"
            >El código del evento es requerido</span
          >
        </div>
      </div>

      <div class="mb-4">
        <input
          formControlName="name"
          type="text"
          placeholder="Nombre"
          class="w-full px-4 py-2 border-b-2 border-white bg-transparent text-white placeholder-white/70 focus:outline-none focus:border-yellow-400 text-center"
        />
        <div
          *ngIf="form.get('name')?.touched && form.get('name')?.errors"
          class="text-red-400 text-sm mt-1 text-left"
        >
          <span *ngIf="form.get('name')?.errors?.['required']">El nombre es requerido</span>
        </div>
      </div>

      <button
        type="submit"
        class="mt-6 w-full py-4 shadow-sm shadow-white bg-[url('/assets/images/boton.png')] bg-cover text-stone-100 block mx-auto rounded-md"
      >
        Unirse
      </button>
    </form>
  </div>
</div>
