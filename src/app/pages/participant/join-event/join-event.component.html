<div class="min-h-screen flex items-center justify-center bg-stone-800 px-4">
  <div
    class="bg-stone-700 rounded-2xl shadow-xl p-8 w-full max-w-md text-center border border-stone-600"
  >
    <h1 class="text-2xl font-bold text-stone-100 mb-4">Enigma Microbiota</h1>
    <p class="text-stone-300 mb-6">Ingresa el código que te dio el organizador</p>
    <form (ngSubmit)="joinEvent()" [formGroup]="form">
      <div class="mb-4">
        <input
          formControlName="eventCode"
          type="text"
          placeholder="Ej. 345679"
          class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-stone-400 bg-stone-600 text-stone-100 placeholder-stone-400"
        />
        <div
          *ngIf="form.get('eventCode')?.touched && form.get('eventCode')?.errors"
          class="text-red-400 text-sm mt-1 text-left"
        >
          <span *ngIf="form.get('eventCode')?.errors?.['required']"
            >El código del evento es requerido</span
          >
        </div>
      </div>

      <div class="mb-4">
        <input
          formControlName="name"
          type="text"
          placeholder="Nombre"
          class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-stone-400 bg-stone-600 text-stone-100 placeholder-stone-400"
        />
        <div
          *ngIf="form.get('name')?.touched && form.get('name')?.errors"
          class="text-red-400 text-sm mt-1 text-left"
        >
          <span *ngIf="form.get('name')?.errors?.['required']">El nombre es requerido</span>
        </div>
      </div>

      <button
        type="submit"
        class="w-full bg-stone-900 hover:bg-stone-950 text-stone-100 py-2 rounded-xl transition"
      >
        Unirse
      </button>
    </form>
  </div>
</div>
