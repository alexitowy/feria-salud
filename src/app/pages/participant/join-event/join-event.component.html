<div class="min-h-screen flex items-center justify-center bg-blue-50 px-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md text-center">
      <h1 class="text-2xl font-bold text-gray-800 mb-4">Unirse a un Evento</h1>
      <p class="text-gray-600 mb-6">Ingresa el código que te dio el organizador</p>

      <input
        [(ngModel)]="eventCode"
        type="text"
        placeholder="Ej. ABC123"
        class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4"
      />

      <button
        (click)="joinEvent()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl transition"
      >
        Unirse
      </button>
    </div>
  </div>
