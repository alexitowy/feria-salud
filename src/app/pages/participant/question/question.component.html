<div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-md">
  <h2 class="text-2xl font-semibold mb-4">{{ question }}</h2>

  <ul class="space-y-2">
    <li *ngFor="let option of options" class="flex items-center">
      <input
        type="radio"
        [id]="option"
        [value]="option"
        name="answer"
        class="mr-2 h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300"
        [(ngModel)]="selectedOption"
      />
      <label [for]="option" class="text-lg">{{ option }}</label>
    </li>
  </ul>

  <button
    (click)="submitAnswer()"
    [disabled]="!selectedOption"
    class="mt-6 bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-lg transition disabled:opacity-50"
  >
    Enviar respuesta
  </button>
</div>
