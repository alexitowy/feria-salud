<div class="fixed inset-0 bg-black/80 flex items-center justify-center z-50" *ngIf="isOpen">
  <div
    class="bg-[url('/assets/images/pergamino.png')] bg-cover bg-center bg-no-repeat w-full h-screen md:h-[90vh] flex items-center justify-center relative"
  >
    <div class="flex flex-col items-center justify-center max-w-xl px-6 text-center">
      @if (imageUrl) {
        <img
          [src]="imageUrl"
          alt="Feedback image"
          class="max-h-60 mx-auto mb-4 rounded shadow-md object-contain"
        />
      }

      @if (title) {
        <h2
          class="text-xl md:text-2xl text-white font-bold mb-4 drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]"
        >
          {{ title }}
        </h2>
      }

      <div
        class="text-white text-base md:text-lg font-semibold leading-relaxed"
        [ngStyle]="{
          textShadow: '2px 2px 4px #000000',
        }"
        [innerHTML]="feedbackHtml"
      ></div>

      <button
        (click)="emitContinue()"
        class="mt-6 px-6 py-3 text-stone-100 font-bold rounded-lg shadow-md bg-[url('/assets/images/boton.png')] bg-cover bg-center hover:opacity-90"
      >
        {{ textButton }}
      </button>
    </div>
  </div>
</div>
