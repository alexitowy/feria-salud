@if (timer) {
  <app-count-down
    [seconds]="question.timeLeft || 120"
    (timeUp)="timeUp()"
    (timeUpdate)="updateTime($event)"
  ></app-count-down>
}
@if (question.description) {
  <h2 class="text-base mb-2">{{ question.description }}</h2>
}
<!-- Question Title -->
<h2 class="text-1xl font-bold mb-6">{{ question.question }}</h2>

<!-- Radio Options -->
<div class="space-y-4">
  @for (answer of question.answers; track $index) {
    <div
      class="flex items-center justify-center p-2 mb-4 rounded-lg bg-[url('/assets/images/madera.jpg')] bg-cover cursor-pointer transition-all duration-300 border border-[#9c9c9c]"
      [class.shadow-lg]="answer.selected"
      [class.transform]="answer.selected"
      [class.scale-105]="answer.selected"
      [class.opacity-100]="answer.selected"
      [class.opacity-100]="answer.selected"
      [class.border-4]="answer.selected"
      [class.opacity-80]="!answer.selected"
      [class.brightness-102]="!answer.selected"
      (click)="setSelectedAnswer(answer)"
    >
      <span class="text-white text-md font-medium">{{ answer.text }}</span>
    </div>
  }
</div>

@if (!automaticResponse) {
  <button
    class="mt-6 px-6 py-4 shadow-sm shadow-white bg-[url('/assets/images/boton.png')] bg-cover text-stone-100 block mx-auto"
    (click)="checkAnswer()"
  >
    Comprobar Respuesta
  </button>
}

<app-modal-feedback
  [isOpen]="showFeedback"
  [feedbackHtml]="question.feedback"
  (continue)="continue()"
></app-modal-feedback>
