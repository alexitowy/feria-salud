<!-- Question Title -->
<h2 class="text-2xl font-bold mb-6">{{ question.question }}</h2>

<!-- Radio Options -->
<div class="space-y-4">
  @for (answer of question.answers; track $index) {
    <div class="flex items-center">
      <input type="radio" id="option{{ $index }}" name="answer" [value]="answer.id" class="mr-2" />
      <label for="option1">{{ answer.text }}</label>
    </div>
  }
</div>
