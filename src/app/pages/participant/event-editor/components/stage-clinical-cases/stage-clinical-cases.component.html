<div
  class="w-full h-screen flex items-center justify-center bg-cover bg-no-repeat bg-[url('/assets/images/fondo_enigma.png')] bg-center"
>
  <!-- Overlay -->
  <div class="inset-0 bg-black bg-opacity-40 p-[16px]">
    <!-- Content Container -->
    <div
      class="relative z-10 max-w-2xl mx-auto p-6 text-white shadow-sm shadow-white rounded-[25px]"
    >
      @if (!isEnd) {
        @switch (currentQuestion.type) {
          @case ('multiple-select') {
            <app-multiple-choice
              [question]="currentQuestion"
              (timeUp$)="timeUp()"
              (correctSelected$)="nextQuestion()"
            ></app-multiple-choice>
          }
          @case ('single-select') {
            <app-single-selection
              [question]="currentQuestion"
              (timeUp$)="timeUp()"
              (correctSelected$)="nextQuestion()"
            ></app-single-selection>
          }
          @case ('text') {
            <app-text
              [question]="currentQuestion"
              (timeUp$)="timeUp()"
              (correctSelected$)="nextQuestion()"
            ></app-text>
          }
          @case ('image') {
            <app-image
              [question]="currentQuestion"
              (timeUp$)="timeUp()"
              (correctSelected$)="nextQuestion()"
            ></app-image>
          }
          @default {
            <p class="text-lg font-bold text-center">Tipo de pregunta no soportado</p>
          }
        }
      } @else {
        <p class="text-lg font-bold text-center">¡Has completado todas las preguntas!</p>
        <p class="text-lg font-bold text-center">¡Felicidades!</p>
        <button
          class="mt-6 px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 block mx-auto"
          (click)="submit()"
        >
          Terminar
        </button>
      }
      <!-- Check Button -->
    </div>
  </div>
</div>
