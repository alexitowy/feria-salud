<div class="w-full h-full mx-auto" cdkDropListGroup>
  <img
    [src]="stageData.background"
    alt="Fondo de consulta medieval"
    class="w-full h-full object-cover absolute inset-0"
  />
  <div class="flex flex-col space-y-8">
    <p class="text-center text-white p-6 relative">
      "Muchos buscan saber si su interior es puro o impuro. Pero lo que importa no es lo que tienes,
      sino cómo lo alimentas."
      <br />"Selecciona los elementos que ayudan a mantener el equilibrio interior".
    </p>
    <div
      cdkDropList
      id="sourceList"
      class="w-full p-4 flex flex-wrap justify-center gap-4 z-30 h-48"
      [cdkDropListConnectedTo]="['balanceDropZone']"
      (cdkDropListDropped)="preventDrop($event)"
    >
      <div
        *ngFor="let option of options"
        class="w-16 h-16 cursor-move"
        cdkDrag
        [cdkDragData]="option"
      >
        <img
          [src]="option.image"
          [alt]="option.name"
          class="w-full h-full object-contain bg-[#614505] rounded-lg"
        />
      </div>
    </div>
    <div class="inset-x-0 flex items-end justify-center z-20 pb-6">
      <div
        cdkDropList
        id="balanceDropZone"
        [cdkDropListConnectedTo]="['sourceList']"
        (cdkDropListDropped)="onItemDropped($event)"
        class="relative w-[75%] h-64 bg-[url('/assets/images/selection.png')] bg-contain bg-no-repeat bg-center"
      >
        @if (droppedItems.length === 0) {
          <div class="absolute inset-0 flex items-center justify-center">
            <p class="text-white text-md font-semibold p-[8px]">Arrastra los elementos aquí</p>
          </div>
        }
        <div
          *ngFor="let item of droppedItems"
          class="absolute w-16 h-16"
          [style.top.px]="item.y"
          [style.left.px]="item.x"
        >
          <img [src]="item.image" alt="Elemento colocado" class="w-full h-full object-contain" />
        </div>
      </div>
    </div>
  </div>

  <div
    *ngIf="feedbackMessage"
    class="absolute top-28 left-1/2 transform -translate-x-1/2 bg-white/90 p-4 rounded-lg shadow-lg text-center z-40 max-w-xs text-black font-semibold"
  >
    {{ feedbackMessage }}
  </div>
</div>
