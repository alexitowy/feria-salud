@if (stageData) {
  <div
    class="text-base md:text-lg font-medium leading-relaxed mb-4 px-4 py-6 text-center text-white bg-black/40 rounded-lg shadow max-w-2xl mx-auto"
  >
    Si acertáis, cada elixir brillara.
    <br />
    <strong
      >Quien primero logre ordenar los seis con verdad, romperá el sello de la bolsa
      maldita.</strong
    >
  </div>
  <div class="text-lg font-medium italic text-center text-yellow-100 mt-4 px-4">
    Rellenad con precisión.
  </div>
  <div
    class="w-full bg-black/30 p-4 rounded-xl flex flex-col items-center text-white bg-cover bg-no-repeat bg-[url('/assets/images/fondo_enigma.png')] bg-center min-h-screen"
  >
    @for (item of stageData.antibioticChallenge.antibiotics; track $index) {
      <div
        class="rounded-2xl p-4 mb-4 shadow-md w-full max-w-md mx-auto transition-colors duration-300"
        [ngClass]="{
          'bg-[#2e2e2e]/70': getCardStatus($index) === 'incomplete',
          'bg-green-300/40': getCardStatus($index) === 'correct',
          'bg-red-300/40': getCardStatus($index) === 'incorrect',
        }"
      >
        <!-- Nombre del antibiótico centrado -->

        <!-- Íconos y selects -->
        <div class="flex flex-col gap-3 items-center text-center">
          <!-- Nombre del antibiótico -->
          <div class="text-white text-lg font-bold">
            {{ item.name }}
          </div>

          <!-- Selects: Estabilidad y Característica -->
          <div class="flex gap-4 w-full justify-center">
            <!-- Estabilidad -->
            <div class="flex flex-col items-center w-1/2">
              <div class="flex items-center gap-1 mb-1">
                <img src="assets/images/potion.png" alt="Estabilidad" class="h-6" />
                <span class="text-sm text-white">Estabilidad</span>
              </div>
              <select
                class="w-full rounded-md bg-blue-100 text-sm text-black px-2 py-1 shadow-sm focus:outline-none"
                (change)="onSelectChange($event, $index, 'stability')"
              >
                <option value="">Selecciona</option>
                @for (option of stageData.antibioticChallenge.options.stability; track $index) {
                  <option [value]="option">{{ option }}</option>
                }
              </select>
            </div>

            <!-- Característica -->
            <div class="flex flex-col items-center w-1/2">
              <div class="flex items-center gap-1 mb-1">
                <img src="assets/images/warning.png" alt="Característica" class="h-6" />
                <span class="text-sm text-white">Característica</span>
              </div>
              <select
                class="w-full rounded-md bg-blue-100 text-sm text-black px-2 py-1 shadow-sm focus:outline-none"
                (change)="onSelectChange($event, $index, 'note')"
              >
                <option value="">Selecciona</option>
                @for (option of stageData.antibioticChallenge.options.note; track $index) {
                  <option [value]="option">{{ option }}</option>
                }
              </select>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
}
<app-modal-feedback
  [isOpen]="winnerAlreadyNotified"
  [feedbackHtml]="feedbackHtml"
  (continue)="continue()"
></app-modal-feedback>
