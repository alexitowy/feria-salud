<div class="min-h-screen flex items-center bg-[#130d00]" *ngIf="event">
  @if (!event.introVideoCompleted) {
    <div class="container mx-auto">
      <div class="max-w-3xl mx-auto rounded-lg overflow-hidden shadow-lg">
        <div class="w-full h-[360px] bg-[#130d00] flex items-center justify-center">
          <p class="text-xl text-white">Organizador presentando</p>
        </div>
      </div>
    </div>
  } @else if (!event.introCompleted) {
    @switch (currentStage) {
      @case (1) {
        <app-stage-microbiota
          [currentStage]="currentStage"
          [stageData]="stageData"
        ></app-stage-microbiota>
      }
      @case (2) {
        <app-stage-balance [stageData]="stageData"></app-stage-balance>
      }
      @case (3) {
        <app-stage-clinical-cases [stageData]="stageData"></app-stage-clinical-cases>
      }
      @case (4) {
        <app-stage-bad-foot [stageData]="stageData"></app-stage-bad-foot>
      }
      @case (5) {
        <app-stage-clinical-cases [stageData]="stageData"></app-stage-clinical-cases>
      }

      @default {
        <div class="text-center text-white p-10">Cargando etapa...</div>
      }
    }
  }
</div>
