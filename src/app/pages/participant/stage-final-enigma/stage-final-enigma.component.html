<div
  class="min-h-screen bg-[url('/assets/images/pergamino-textura.png')] bg-cover bg-center bg-no-repeat"
>
  <!-- Introducción -->
  <div class="max-w-4xl mx-auto px-4 py-8 text-center">
    <h2 class="text-2xl md:text-3xl font-bold text-[#3e2f1c] mb-4">
      Último Reto: “¿Dónde se oculta el curandero?”
    </h2>
    <p class="text-base md:text-lg text-[#5a4324] leading-relaxed">
      Tres verdades os han sido entregadas:<br />
      Una letra, un número… y el camino dibujado por sabios antiguos.
    </p>
  </div>

  <!-- Mapa con coordenadas -->
  <div class="relative w-full">
    <img src="assets/images/map.jpg" class="w-full object-contain" />
    @for (cell of grid; track cell.coord) {
      <button
        class="absolute"
        [ngClass]="{
          'bg-red-500/40': wrongCells.includes(cell.coord),
          'bg-transparent': !wrongCells.includes(cell.coord),
        }"
        [style.top]="cell.top"
        [style.left]="cell.left"
        [style.width]="cell.width"
        [style.height]="cell.height"
        (click)="checkCell(cell.coord)"
        [attr.title]="cell.coord"
      ></button>
    }
  </div>

  <!-- Pistas -->
  <div class="mt-8 w-full max-w-3xl mx-auto px-4">
    <h2 class="text-2xl font-bold text-center text-[#3e2f1c]">Pistas recolectadas</h2>
    <div class="grid grid-cols-2 gap-6">
      @for (imgPath of awards; track imgPath) {
        <div class="flex items-center justify-center h-[250px] bg-transparent">
          <img
            [src]="imgPath"
            alt="Pista"
            class="max-h-full max-w-full object-contain transition-transform duration-200 hover:scale-105"
          />
        </div>
      }
    </div>
  </div>
</div>

<app-modal-feedback
  [isOpen]="winnerAlreadyNotified"
  [feedbackHtml]="msg"
  (continue)="continue()"
></app-modal-feedback>
