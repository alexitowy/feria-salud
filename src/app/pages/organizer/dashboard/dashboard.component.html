<div class="min-h-screen flex items-center bg-[#130d00]" *ngIf="event">
  @if (!event.introVideoCompleted) {
    <div class="container mx-auto">
      <div class="max-w-3xl mx-auto rounded-lg overflow-hidden shadow-lg">
        <video class="w-full h-auto" controls>
          <source src="assets/videos/intro.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
        <div class="p-4 bg-white">
          <div class="flex space-x-4 justify-center">
            <button
              class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded"
              (click)="startVideo()"
            >
              Reproducir
            </button>
            <button
              class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded"
              (click)="pauseVideo()"
            >
              Pausar
            </button>
            <button
              class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded"
              (click)="continue()"
            >
              Continuar
            </button>
          </div>
        </div>
      </div>
    </div>
  } @else {
    <div class="container mx-auto p-6 flex flex-col items-center space-y-6">
      <h2 class="text-3xl font-bold text-white mb-6 text-center">Participantes del Escape Room</h2>
      <p class="text-white text-lg mb-4" *ngIf="playersRemaining > 0">
        Faltan {{ playersRemaining }} jugador{{ playersRemaining > 1 ? 'es' : '' }} por responder
      </p>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full">
        <div class="bg-white rounded-lg shadow-lg p-4" *ngFor="let user of participants">
          <div class="flex items-center space-x-4">
            <img [src]="user.avatar" alt="Usuario" class="w-16 h-18 rounded-full bg-stone-600" />

            <div>
              <h3 class="font-bold text-lg">{{ user.name }}</h3>
              <p class="text-gray-600">Puntos: {{ user.points ? user.points : 0 }}</p>
            </div>
          </div>
        </div>
      </div>

      <!-- 🔥 Botón solo para lanzar a la siguiente etapa -->
      <div class="flex justify-center w-full" *ngIf="allPlayersReady">
        <button
          class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg"
          (click)="continueToNextStage()"
        >
          Continuar a la siguiente etapa
        </button>
      </div>
    </div>
  }
</div>
