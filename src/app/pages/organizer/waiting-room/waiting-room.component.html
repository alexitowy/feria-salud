<div class="min-h-screen bg-gray-50 p-6">
  <div class="max-w-2xl mx-auto bg-white shadow-xl rounded-2xl p-8">
    <h1 class="text-2xl font-bold mb-4 text-gray-800">Sala de espera</h1>
    <p class="text-gray-600 mb-6">Participantes registrados hasta el momento:</p>

    <ul class="space-y-3" *ngIf="participants$ | async as participants">
      <li
        *ngFor="let p of participants; trackBy: trackById"
        class="p-4 border rounded-xl bg-gray-100 flex justify-between items-center"
      >
        <span class="font-medium">{{ p.name }}</span>
      </li>
    </ul>

    <div class="mt-6 text-center">
      <button
        class="px-6 py-2 bg-green-600 text-white font-semibold rounded-xl hover:bg-green-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="isStarting"
        (click)="startEvent()"
      >
        <span *ngIf="!isStarting">Start Event</span>
        <span *ngIf="isStarting">Starting...</span>
      </button>
    </div>

    <p *ngIf="(participants$ | async)?.length === 0" class="text-sm text-gray-400 text-center">
      No hay participantes todavía...
    </p>
  </div>
</div>
